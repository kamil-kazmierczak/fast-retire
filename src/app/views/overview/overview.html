<div class="level">
    @if (portfolioResponse$ | async; as portfolio) {
        @for (item of portfolio.portfolioItems; track $index) {
            <div class="level-item has-text-centered">
                <div>
                    <p class="heading">{{ item.assetName }}</p>
                    <p class="title">{{ item.value }} {{ item.currency }}</p>
                </div>
            </div>
        }
    }
</div>
<hr>
<div>
    <apx-chart #pieChart
               [series]="pieChartOptions.series"
               [chart]="pieChartOptions.chart"
               [xaxis]="pieChartOptions.xaxis"
               [title]="pieChartOptions.title"
    ></apx-chart>
</div>

<div>
    <apx-chart #lineChart
               [series]="lineChartOptions.series"
               [chart]="lineChartOptions.chart"
               [xaxis]="lineChartOptions.xaxis"
               [yaxis]="lineChartOptions.yaxis"
               [title]="lineChartOptions.title"
               [dataLabels]="lineChartOptions.dataLabels"
               [stroke]="lineChartOptions.stroke"
               [tooltip]="lineChartOptions.tooltip"
    ></apx-chart>
</div>
